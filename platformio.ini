[platformio]
default_envs = waveshare-esp32-s3-touch-lcd-154

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_unflags = 
    -std=gnu++11
build_flags = 
    -std=gnu++17
    -Wall
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    mathieucarbou/ESP Async WebServer
    mathieucarbou/AsyncTCP
    bblanchon/ArduinoJson

[env:waveshare-esp32-s3-touch-lcd-154]
board = waveshare-esp32-s3-touch-lcd-154

[env:crowpanel-7]
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DCROWPANEL_7

[env:crowpanel-7-buffered]
extends = env:crowpanel-7
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board_build.partitions = boards/crowpanel-huge-app.csv
lib_ignore = Async TCP
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
build_flags =
    ${env:crowpanel-7.build_flags}
    -DCROWPANEL_BUFFERED
